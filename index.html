<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AURA Restaurant</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;

        background: url(./ChatGPT\ Image\ Aug\ 8\,\ 2026\,\ 08_13_59\ PM.png);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Menu Button */

      .menu {
        position: absolute;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
      }

      .menu a {
        display: inline-block;
        text-decoration: none;
        color: black;
        background: rgb(56, 152, 193);
        padding: 18px 55px;
        font-size: clamp(18px, 2vw, 26px);
        font-weight: bold;
        border-radius: 35px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        transition: 0.3s;
      }

      .menu a:hover {
        background: white;
        color: black;
        transform: translateY(-6px) scale(1.05);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }

      /* Mobile */

      @media (max-width: 600px) {
        .menu {
          bottom: 30px;
        }

        .menu a {
          width: 230px;
          text-align: center;
          padding: 15px 20px;
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="menu">
      <a href="main.html">🍽 To the Menu</a>
    </div>
  </body>
</html>
